<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" width="420" height="96">
  <!-- La couronne noire des Stryges, cinq pointes pour les cinq sangs, et le
       nom du monde grave dans l'argent terni. Dessin original, aucune source. -->
  <defs>
    <linearGradient id="argent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9dcdf"/>
      <stop offset=".45" stop-color="#a3a8ad"/>
      <stop offset=".55" stop-color="#7d8288"/>
      <stop offset="1" stop-color="#b4b8bc"/>
    </linearGradient>
    <linearGradient id="fer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b30"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <radialGradient id="goutte" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#a3302c"/>
      <stop offset=".6" stop-color="#6e1714"/>
      <stop offset="1" stop-color="#3a0907"/>
    </radialGradient>
    <filter id="grave" x="-5%" y="-20%" width="110%" height="140%">
      <feOffset dx="0" dy="1.2" in="SourceAlpha" result="bas"/>
      <feFlood flood-color="#000" flood-opacity=".85"/>
      <feComposite in2="bas" operator="in" result="ombre"/>
      <feMerge><feMergeNode in="ombre"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- la couronne -->
  <g transform="translate(8 10)" filter="url(#grave)">
    <path d="M6 62 L2 18 L18 36 L26 6 L38 32 L46 0 L54 32 L66 6 L74 36 L90 18 L86 62 Z"
          fill="url(#fer)" stroke="url(#argent)" stroke-width="2" stroke-linejoin="miter"/>
    <rect x="4" y="62" width="84" height="10" fill="url(#fer)" stroke="url(#argent)" stroke-width="2"/>
    <g fill="url(#argent)">
      <circle cx="2" cy="17" r="2.6"/><circle cx="26" cy="5" r="2.6"/>
      <circle cx="46" cy="-1" r="2.8"/><circle cx="66" cy="5" r="2.6"/>
      <circle cx="90" cy="17" r="2.6"/>
    </g>
    <path d="M46 40 C46 40 39 50 39 55 A7 7 0 0 0 53 55 C53 50 46 40 46 40 Z"
          fill="url(#goutte)" stroke="#c6cacd" stroke-opacity=".55" stroke-width=".8"/>
    <g fill="#8d9298"><circle cx="20" cy="67" r="1.6"/><circle cx="46" cy="67" r="1.6"/><circle cx="72" cy="67" r="1.6"/></g>
  </g>

  <!-- le nom, en capitales gravees -->
  <g filter="url(#grave)" font-family="'Palatino Linotype','Book Antiqua',Palatino,'Times New Roman',serif"
     fill="url(#argent)">
    <text x="118" y="50" font-size="33" letter-spacing="5.5">VAMPIRE</text>
    <text x="120" y="82" font-size="21" letter-spacing="10.5">COUNTS</text>
  </g>
  <path d="M120 60 H404" stroke="#7d8288" stroke-width=".8" opacity=".7"/>
  <path d="M262 60 m-4 0 l4 -3 l4 3 l-4 3 z" fill="#6e1714" stroke="#a3a8ad" stroke-width=".6"/>
</svg>
