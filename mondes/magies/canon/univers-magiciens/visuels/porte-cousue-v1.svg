<path d="M178 659H550M202 659L186 676M240 659L224 676M278 659L262 676M316 659L300 676M354 659L338 676M392 659L376 676M430 659L414 676M468 659L452 676M506 659L490 676" fill="none" stroke="#849487" stroke-width="2" />
<text x="239" y="701" font-size="14" fill="#35434a" font-weight="400">Fondations : récepteur des efforts</text>
<path d="M172 385H292" fill="none" stroke="#bb6645" stroke-width="5" marker-end="url(#arrow)"/>
<text x="59" y="367" font-size="17" fill="#a25236" font-weight="600">Impact</text>
<circle cx="299" cy="385" r="10" fill="#f2bd94" stroke="#bb6645"/>
<path d="M301 385L217 272M301 385L490 266M301 385L233 574M301 385L490 574" fill="none" stroke="#bb6645" stroke-width="2" stroke-dasharray="6 5"/>
