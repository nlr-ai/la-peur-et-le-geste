<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1510" viewBox="0 0 1600 1510" role="img" aria-labelledby="title desc"><title id="title">La Porte cousue — planche complète v1</title><desc id="desc">Vue de face avec quatre sceaux reliés, coupe plaçant la frontière devant les vantaux, composants et préparation, alimentation séparée de la commande, transferts des efforts, séquence d’utilisation et défauts. Les choix de détail sont proposés, sans dimensions ni puissance fixées.</desc><defs><pattern id="stone" width="60" height="36" patternUnits="userSpaceOnUse"><rect width="60" height="36" fill="#dce0da"/><path d="M0 0H60M0 36H60M30 0V36" fill="none" stroke="#c6cdc7"/></pattern><pattern id="field" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M0 20L20 0" stroke="#55a7a1" stroke-opacity=".22"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><rect width="1600" height="1510" fill="#f2f3ec"/><g font-family="Segoe UI, Arial, sans-serif">
<text x="40" y="53" font-size="32" fill="#243f48" font-weight="700">LA PORTE COUSUE</text>
<text x="41" y="84" font-size="17" fill="#35434a" font-weight="400">Bastion · Protection + Matière + Enchantement · recette d’une frontière anti-solides</text>
<text x="1220" y="49" font-size="14" fill="#6d797a" font-weight="600">PLANCHE DE CONCEPTION V1</text>
<text x="1220" y="76" font-size="14" fill="#6d797a" font-weight="400">Sans échelle · capacités à définir</text>
<rect x="30" y="111" width="930" height="639" rx="10" fill="#fffdf7" stroke="#d6dcd9"/>
<rect x="980" y="111" width="590" height="639" rx="10" fill="#fffdf7" stroke="#d6dcd9"/>
<text x="53" y="147" font-size="20" fill="#243f48" font-weight="700">01 / VUE DE FACE — depuis l’extérieur</text>
<text x="53" y="174" font-size="15" fill="#35434a" font-weight="400">Quatre sceaux · un contour fermé · une ouverture entière</text>
<rect x="178" y="214" width="365" height="420" rx="2" fill="url(#stone)" stroke="#83918a"/>
<rect x="230" y="267" width="263" height="312" rx="2" fill="#a59071" stroke="#726653"/>
