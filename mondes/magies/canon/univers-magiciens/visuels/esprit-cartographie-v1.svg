 <!-- In-chart labels. -->
 <g font-size="14" font-style="italic">
  <text x="267" y="335" fill="#37696e">Le métier de la mer</text>
  <text x="282" y="385">Nouer les cordages</text>
  <text x="416" y="429">Tenir dans la tempête</text>
  <text x="678" y="350" fill="#827045">La maison d’enfance</text>
  <text x="790" y="403">Le pain chaud</text>
  <text x="757" y="490">La voix maternelle</text>
  <text x="281" y="590" fill="#955b54">Ce qui a été perdu</text>
  <text x="261" y="651">La main qui échappe</text>
  <text x="279" y="774">Attendre un retour</text>
  <text x="655" y="637" fill="#686486">Recevoir du secours</text>
  <text x="712" y="723">Une main tendue</text>
  <text x="733" y="800">Le feu sur la rive</text>
 </g>
 <rect x="466" y="587" width="177" height="29" rx="9" fill="#f4ecd9"/>
 <text x="555" y="607" text-anchor="middle" font-size="19">Le naufrage</text>
 <!-- Incomplete region, not an inferred secret. -->
 <path d="M535 749Q566 726 585 775L586 831L527 846L511 796Z" fill="url(#hatch)" stroke="#a6957f" stroke-dasharray="3 5"/>
 <text x="550" y="873" text-anchor="middle" font-size="12" fill="#827967" font-style="italic">Non relevé</text>
 <!-- External hops through similar experiences. -->
 <g fill="none" stroke="#567f80" stroke-width="1.5" stroke-dasharray="5 6">
  <path d="M474 374C478 245 452 205 325 220L170 244"/>
