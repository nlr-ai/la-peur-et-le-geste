<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc">
<title id="title">L’esprit d’une navigatrice — portrait cartographique</title>
<desc id="desc">Dessin fictif à l’encre sur fond de parchemin. Des régions de souvenirs entourent un souvenir de naufrage : métier, enfance, perte et secours. Des traits relient les souvenirs ; des pointillés prolongent certains chemins vers d’autres esprits. Une ligne ocre distincte représente un relais télépathique. Les conventions et les souvenirs sont proposés, sans géographie mentale littérale ni lecture exhaustive.</desc>
<defs>
 <pattern id="paper" width="37" height="31" patternUnits="userSpaceOnUse"><circle cx="4" cy="9" r=".6" fill="#9f8865" opacity=".16"/><circle cx="24" cy="23" r=".45" fill="#9f8865" opacity=".13"/></pattern>
 <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(25)"><path d="M0 0V9" stroke="#968574" stroke-width="1" opacity=".3"/></pattern>
 <g id="node"><circle r="9" fill="#f4ecd9" stroke="currentColor" stroke-width="2"/><circle r="3" fill="currentColor"/></g>
 <g id="gate" fill="#f4ecd9" stroke="currentColor" stroke-width="2"><circle r="18"/><circle r="12"/><path d="M-25 0H-12M12 0H25M0 -25V-12M0 12V25"/></g>
 <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#a67a32" stroke-width="1.5"/></marker>
</defs>
