 <text x="76" y="82" font-size="13" letter-spacing="3" fill="#797258">CARTOGRAPHIE DES ESPRITS</text>
 <text x="76" y="137" font-size="43">L’esprit d’une navigatrice</text>
 <text x="78" y="172" font-size="18" font-style="italic" fill="#736d5d">Souvenirs reconnus, chemins d’association et prises de contact</text>
 <text x="1360" y="82" text-anchor="end" font-size="13" fill="#797258">PLANCHE I · EXEMPLE FICTIF</text>
