  <path d="M714 685C875 580 897 554 1042 541"/>
 </g>
 <g font-size="13" font-style="italic" fill="#477477">
  <text x="95" y="234">Vers un autre survivant</text>
  <text x="89" y="925">Vers une attente comparable</text>
 </g>
 <!-- Right-hand marginal notes. -->
 <path d="M1036 238V930" stroke="#c5b79a"/>
 <text x="1065" y="268" font-size="20">Notes du cartographe</text>
 <text x="1065" y="309" font-size="15" font-style="italic">« Entrer par la tempête.</text>
 <text x="1065" y="332" font-size="15" font-style="italic">Ne pas confondre sa peur</text>
 <text x="1065" y="355" font-size="15" font-style="italic">avec la mienne. »</text>
 <path d="M1065 386H1345" stroke="#c5b79a"/>
 <text x="1065" y="420" font-size="16">Une référence pour entrer</text>
 <text x="1065" y="450" font-size="14" fill="#736d5d">Un vécu comparable donne prise.</text>
 <text x="1065" y="472" font-size="14" fill="#736d5d">La proximité affine la lecture.</text>
 <g color="#726f94"><use href="#gate" x="1068" y="541"/></g>
 <text x="1100" y="532" font-size="16">Esprit secourable</text>
 <text x="1100" y="555" font-size="13" fill="#736d5d">Saut possible à explorer</text>
 <text x="1065" y="609" font-size="14" font-style="italic">Un autre télépathe peut fournir</text>
 <text x="1065" y="632" font-size="14" font-style="italic">la référence qui manque.</text>
 <!-- Power relay is distinct from memory paths. -->
 <path d="M1068 763C978 763 998 676 938 645" fill="none" stroke="#a67a32" stroke-width="3" marker-end="url(#arrow)"/>
 <path d="M1068 745L1086 763L1068 781L1050 763Z" fill="#f4ecd9" stroke="#a67a32" stroke-width="2"/>
 <path d="M1068 754V772M1059 763H1077" stroke="#a67a32" stroke-width="1.5"/>
 <text x="1101" y="758" font-size="16" fill="#906b2f">Relai de puissance</text>
 <text x="1101" y="782" font-size="13" fill="#736d5d">Soutien des télépathes</text>
 <text x="1065" y="828" font-size="14" fill="#736d5d">Apporte de la puissance d’esprit.</text>
 <text x="1065" y="851" font-size="14" fill="#736d5d">Ne remplace pas le vécu requis.</text>
 <text x="1065" y="899" font-size="13" font-style="italic" fill="#827967">Chemins et disponibilité à vérifier.</text>
 <!-- Legend. -->
 <path d="M76 963H1364" stroke="#bdab8a"/>
 <g font-size="13">
  <g color="#536b65"><use href="#node" x="93" y="999"/></g><text x="113" y="1004">Souvenir repéré</text>
  <path d="M293 999H331" stroke="#536b65" stroke-width="2"/><text x="342" y="1004">Association</text>
  <g color="#536b65"><use href="#gate" x="523" y="999"/></g><text x="551" y="1004">Prise de contact</text>
  <path d="M763 999H810" stroke="#567f80" stroke-width="1.5" stroke-dasharray="5 6"/><text x="822" y="1004">Saut vers un autre esprit</text>
  <path d="M1121 999H1164" stroke="#a67a32" stroke-width="3" marker-end="url(#arrow)"/><text x="1179" y="1004">Puissance relayée</text>
 </g>
 <text x="76" y="1052" font-size="13" fill="#797258">Conventions et souvenirs proposés. Relevé partiel dessiné : positions symboliques, aucune lecture exhaustive de l’esprit.</text>
</g>
</svg>
