<use href="#watch" x="135" y="645"/><use href="#watch" x="705" y="645"/>
<use href="#forge" x="225" y="359"/><use href="#forge" x="613" y="359"/>
<use href="#forge" x="225" y="540"/><use href="#forge" x="613" y="540"/>
