<path d="M225 359H161V320H120 M613 359H680V320H720 M225 540H161V570H120 M613 540H680V570H720"/>
</g>
<!-- circulation -->
<g fill="none" stroke="#bba989" stroke-width="15">
<path d="M420 210V660 M120 435H720"/>
</g>
<!-- section gates -->
<g stroke="#776552" stroke-width="9">
<path d="M394 322H446 M394 550H446 M272 410V460 M568 410V460"/>
</g>
<!-- central command -->
<rect x="351" y="393" width="138" height="84" rx="14" fill="#eee4cb" stroke="#928062" stroke-width="2"/>
<text x="420" y="428" text-anchor="middle" fill="#473e31" font-size="14" font-weight="700">COMMANDEMENT</text>
<text x="420" y="451" text-anchor="middle" fill="#78694e" font-size="13">Héloïse · équipes</text>
<!-- outer gates -->
<g fill="#f5f1e7" stroke="#646e73" stroke-width="3">
<rect x="393" y="196" width="54" height="29" rx="3"/>
<rect x="393" y="645" width="54" height="29" rx="3"/>
