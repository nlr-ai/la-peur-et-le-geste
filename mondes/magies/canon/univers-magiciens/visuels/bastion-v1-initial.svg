<use href="#shelter" x="342" y="540"/><use href="#shelter" x="496" y="540"/>
<!-- cisterns -->
<g fill="#d5ecf2" stroke="#3a94b2" stroke-width="2">
<rect x="240" y="235" width="76" height="28" rx="8"/>
<rect x="520" y="607" width="76" height="28" rx="8"/>
