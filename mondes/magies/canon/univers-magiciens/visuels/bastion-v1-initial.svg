<g fill="#236c87" font-size="11" font-weight="600">
<text x="278" y="254" text-anchor="middle">CITERNE</text><text x="558" y="626" text-anchor="middle">CITERNE</text>
</g>
<!-- numbered markers -->
<use href="#badge" x="120" y="378"/><text x="120" y="384" text-anchor="middle" fill="#46555d" font-size="17" font-weight="700">2</text>
<use href="#badge" x="693" y="489"/><text x="693" y="495" text-anchor="middle" fill="#237b99" font-size="17" font-weight="700">3</text>
<use href="#badge" x="420" y="550"/><text x="420" y="556" text-anchor="middle" fill="#76614b" font-size="17" font-weight="700">4</text>
<!-- compass -->
<path d="M767 195V151L759 165M767 151L775 165" fill="none" stroke="#7a7267" stroke-width="2"/>
<text x="767" y="141" text-anchor="middle" fill="#7a7267" font-size="13">N</text>
<!-- legend -->
<rect x="831" y="111" width="334" height="650" rx="16" fill="#fffdf7" stroke="#d9d0bf"/>
<text x="855" y="148" fill="#282e32" font-size="20" font-weight="700">Les six ouvrages</text>
<g font-size="15" font-weight="700">
<text x="855" y="191" fill="#70568f">1 · Belvédères</text>
<text x="855" y="270" fill="#46555d">2 · Courtines à filtres</text>
<text x="855" y="349" fill="#237b99">3 · Couronnes d’eau</text>
<text x="855" y="428" fill="#76614b">4 · Quartiers articulés</text>
<text x="855" y="507" fill="#a6532d">5 · Fournaises</text>
<text x="855" y="586" fill="#3f7552">6 · Maisons de veille</text>
</g>
<g fill="#6e7069" font-size="13">
<text x="855" y="213">Observer des lieux et menaces ciblés.</text><text x="855" y="232">Divination + Enchantement</text>
<text x="855" y="292">Arrêter des phénomènes identifiés.</text><text x="855" y="311">Protection + Matière + Enchantement</text>
<text x="855" y="371">Distribuer l’eau stockée aux défenses.</text><text x="855" y="390">Éléments + Matière + Enchantement</text>
<text x="855" y="450">Isoler une brèche, ouvrir un repli.</text><text x="855" y="469">Matière + Enchantement</text>
<text x="855" y="529">Conduire le feu et la chaleur disponibles.</text><text x="855" y="548">Éléments + Matière + Enchantement</text>
<text x="855" y="608">Abriter les habitants par quartier.</text><text x="855" y="627">Protection + Matière + Enchantement</text>
</g>
<path d="M855 653H1141" stroke="#e4dccd"/>
<path d="M855 679H891" stroke="#3a94b2" stroke-width="4"/><text x="904" y="684" fill="#636760" font-size="13">Eau · conduits et couronne</text>
<path d="M855 708H891" stroke="#bf7043" stroke-width="4" stroke-dasharray="8 4"/><text x="904" y="713" fill="#636760" font-size="13">Chaleur · circuits préparés</text>
<path d="M855 737H891" stroke="#bba989" stroke-width="7"/><text x="904" y="742" fill="#636760" font-size="13">Circulation · voies intérieures</text>
<text x="48" y="795" fill="#555e61" font-size="14">Observer → filtrer → soutenir → compartimenter → abriter</text>
<text x="48" y="821" fill="#888176" font-size="12">Disposition indicative : quatre quartiers pour lire le système. Ni dimensions, ni effectifs, ni puissance fixés.</text>
</g>
</svg>
