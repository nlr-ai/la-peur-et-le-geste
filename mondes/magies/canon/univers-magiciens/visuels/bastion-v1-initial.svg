<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
<title id="title">Le Bastion — carte des défenses magiques v1</title>
<desc id="desc">Plan schématique proposé : quatre quartiers entourent le commandement. Courtines et couronne d’eau bordent la ville. Quatre belvédères occupent les angles ; chaque quartier possède une fournaise et une maison de veille. Deux portes et des cloisons intérieures organisent les accès. La légende distingue eau, chaleur et voies de circulation.</desc>
<defs>
 <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#e5dfd1" stroke-width=".6"/></pattern>
 <g id="watch"><circle r="22" fill="#f5f1e6" stroke="#7e69a3" stroke-width="4"/><text text-anchor="middle" y="6" fill="#604c83" font-size="19" font-weight="700">1</text></g>
 <g id="shelter"><rect x="-24" y="-20" width="48" height="40" rx="8" fill="#d7e8d9" stroke="#427858" stroke-width="2"/><text text-anchor="middle" y="6" fill="#285b3c" font-size="18" font-weight="700">6</text></g>
 <g id="forge"><path d="M0 -25L24 15H-24Z" fill="#f5c69d" stroke="#ae562f" stroke-width="2"/><text text-anchor="middle" y="9" fill="#75361c" font-size="18" font-weight="700">5</text></g>
 <g id="badge"><circle r="16" fill="#fffdf5" stroke="#766d62" stroke-width="1.5"/></g>
</defs>
<rect width="1200" height="850" fill="#f5f1e7"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="48" y="54" fill="#282e32" font-size="30" font-weight="700">LE BASTION</text>
<text x="49" y="83" fill="#696b67" font-size="16">La Citadelle allumée · défenses magiques v1</text>
<text x="1148" y="54" text-anchor="end" fill="#7a7267" font-size="13">PROPOSITION · PLAN SANS ÉCHELLE</text>
<rect x="35" y="111" width="772" height="650" rx="16" fill="url(#grid)" stroke="#d9d0bf"/>
<!-- Roads outside -->
<path d="M420 112V211 M420 661V760" stroke="#c9b797" stroke-width="28"/>
<text x="442" y="152" fill="#81715d" font-size="13">Route du nord</text>
<text x="444" y="732" fill="#81715d" font-size="13">Route du sud</text>
<!-- Wall and water -->
<rect x="120" y="210" width="600" height="450" rx="38" fill="#e6dfd1" stroke="#646e73" stroke-width="22"/>
<rect x="147" y="237" width="546" height="396" rx="22" fill="#f7f4ec" stroke="#3a94b2" stroke-width="9"/>
<!-- districts -->
<g fill="#e9e2d5" stroke="#cfc5b4" stroke-width="1.5">
<rect x="177" y="267" width="210" height="129" rx="10"/>
<rect x="453" y="267" width="210" height="129" rx="10"/>
<rect x="177" y="474" width="210" height="129" rx="10"/>
<rect x="453" y="474" width="210" height="129" rx="10"/>
</g>
<g fill="#625f58" font-size="13" font-weight="600">
<text x="194" y="288">QUARTIER DES ATELIERS</text><text x="470" y="288">QUARTIER DES JARDINS</text>
<text x="194" y="496">QUARTIER DES HALLES</text><text x="470" y="496">QUARTIER DES MAISONS</text>
</g>
<!-- water branch pipes -->
<g fill="none" stroke="#3a94b2" stroke-width="4">
<path d="M282 237V308H205 M558 237V308H635 M282 633V574H205 M558 633V574H635"/>
</g>
<!-- heat from forges to wall -->
