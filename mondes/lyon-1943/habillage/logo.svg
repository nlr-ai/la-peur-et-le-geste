<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" width="420" height="96">
  <!-- Une croix de Lorraine tirée au pochoir rouge, comme on la peignait la
       nuit sur les murs ; à côté, le nom composé en lettres de plomb et la date
       tapée à la machine. L'encre bave un peu : un léger brouillage de bord.
       Dessin original, à grands traits : une enseigne, pas un emblème exact. -->
  <defs>
    <filter id="bave" x="-5%" y="-10%" width="110%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" result="grain"/>
      <feDisplacementMap in="SourceGraphic" in2="grain" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <g filter="url(#bave)">
    <!-- le tampon : un cadre rouge, ouvert d'un côté comme un pochoir usé -->
    <path d="M14 10 H80 M14 10 V86 H80 M80 86 V62" fill="none" stroke="#b3261e" stroke-width="2.4"/>
    <!-- la croix de Lorraine, ses ponts de pochoir laissés en réserve -->
    <g fill="#c4352b">
      <rect x="43" y="14" width="10" height="27"/>
      <rect x="43" y="44" width="10" height="38"/>
      <rect x="35" y="25" width="26" height="7"/>
      <rect x="27" y="44" width="19" height="8"/>
      <rect x="50" y="44" width="19" height="8"/>
    </g>
  </g>

  <g filter="url(#bave)" fill="#e6e0d0">
    <text x="102" y="52" font-family="Georgia,'Times New Roman',serif" font-weight="700"
          font-size="38" letter-spacing="9">LYON</text>
    <text x="104" y="82" font-family="'Courier New',Courier,monospace" font-weight="700"
          font-size="19" letter-spacing="6">MARS 1943</text>
  </g>
  <path d="M102 61 H406" stroke="#b3261e" stroke-width="2"/>
  <path d="M290 70 H406" stroke="#e6e0d0" stroke-width=".8" opacity=".45" stroke-dasharray="6 3"/>
</svg>
