<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Tranche 2D hall–salon–galerie — structure DEV v0.1</title>
  <desc id="desc">Topologie du plan initial, lecture publique de trois tâches et état des couches municipales. Aucun passage dessiné n'est déclaré essayé ou permis.</desc>
  <defs>
    <style>
      .bg{fill:#f5f1e8}.panel{fill:#fffdf8;stroke:#384a50;stroke-width:2}.node{fill:#e6f2f0;stroke:#157f8b;stroke-width:3}.edge{stroke:#157f8b;stroke-width:5;fill:none}.edge-off{stroke:#69777b;stroke-width:4;stroke-dasharray:10 8;fill:none}.label{font:700 24px system-ui,sans-serif;fill:#15292f}.body{font:18px system-ui,sans-serif;fill:#24383e}.small{font:15px system-ui,sans-serif;fill:#40555b}.ok{fill:#287a43}.warn{fill:#a54d1d}.unknown{fill:#6b5b73}.tag{font:700 15px system-ui,sans-serif}.title{font:700 34px system-ui,sans-serif;fill:#10272e}.subtitle{font:19px system-ui,sans-serif;fill:#40555b}.rule{stroke:#c9c2b5;stroke-width:2}.white{fill:#fff}.blank{fill:#fff3df;stroke:#b56b22;stroke-width:2;stroke-dasharray:8 6}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#157f8b"/></marker>
  </defs>
  <rect class="bg" width="1400" height="900"/>
  <text x="55" y="55" class="title">Tranche 2D hall–salon–galerie</text>
  <text x="55" y="88" class="subtitle">DEV · v0.1 · proposition de conception · 2042.1.1, 17h10</text>
  <text x="1345" y="55" text-anchor="end" class="tag unknown">DESSINÉ ≠ ESSAYÉ ≠ PERMIS</text>

  <rect x="45" y="120" width="810" height="470" rx="16" class="panel"/>
  <text x="75" y="160" class="label">Donnée commune — topologie canonique</text>
  <text x="75" y="188" class="small">Source : plan-initial-radiant-core · transcription 30307</text>

  <rect x="75" y="280" width="150" height="78" rx="12" class="node"/>
  <text x="150" y="312" text-anchor="middle" class="label">Parvis</text>
  <text x="150" y="337" text-anchor="middle" class="small">bord de tranche</text>

  <rect x="300" y="265" width="190" height="108" rx="12" class="node"/>
  <text x="395" y="307" text-anchor="middle" class="label">Hall</text>
  <text x="395" y="334" text-anchor="middle" class="small">existant au plan</text>
  <text x="395" y="357" text-anchor="middle" class="tag warn">usage non décidé</text>

  <rect x="575" y="265" width="210" height="108" rx="12" class="node"/>
  <text x="680" y="307" text-anchor="middle" class="label">Salon</text>
  <text x="680" y="334" text-anchor="middle" class="small">existant au plan</text>
  <text x="680" y="357" text-anchor="middle" class="tag warn">usage non décidé</text>

  <rect x="575" y="430" width="210" height="108" rx="12" class="node"/>
  <text x="680" y="472" text-anchor="middle" class="label">Galerie</text>
  <text x="680" y="499" text-anchor="middle" class="small">existante au plan</text>
  <text x="680" y="522" text-anchor="middle" class="tag warn">usage non décidé</text>

  <rect x="300" y="445" width="190" height="78" rx="12" class="panel"/>
  <text x="395" y="477" text-anchor="middle" class="label">Conseil</text>
  <text x="395" y="502" text-anchor="middle" class="small">travail · hors tranche</text>

  <path d="M225 319 L300 319" class="edge" marker-end="url(#arrow)"/>
  <path d="M490 319 L575 319" class="edge" marker-end="url(#arrow)"/>
  <path d="M680 373 L680 430" class="edge" marker-end="url(#arrow)"/>
  <path d="M395 373 L395 445" class="edge-off"/>
  <path d="M490 484 L575 484" class="edge-off"/>
  <text x="262" y="303" text-anchor="middle" class="small">1 min*</text>
  <text x="532" y="303" text-anchor="middle" class="small">1 min*</text>
  <text x="697" y="407" class="small">1 min*</text>
  <text x="410" y="413" class="small">1 min*</text>
  <text x="532" y="470" text-anchor="middle" class="small">1 min*</text>
  <text x="75" y="565" class="small">* minute conventionnelle · passage dessiné, non essayé · aucun droit déduit</text>

  <rect x="885" y="120" width="470" height="470" rx="16" class="panel"/>
  <text x="915" y="160" class="label">Lecture publique — trois tâches</text>
  <line x1="915" y1="184" x2="1325" y2="184" class="rule"/>
  <text x="915" y="220" class="tag ok">1 · REJOINDRE UN ENTRETIEN</text>
  <text x="915" y="250" class="body">Hall → Salon : chemin trouvé au dessin.</text>
  <text x="915" y="277" class="small">Praticabilité, permission et usage : inconnus.</text>
  <line x1="915" y1="302" x2="1325" y2="302" class="rule"/>
  <text x="915" y="338" class="tag warn">2 · ATTENDRE HORS PASSAGE</text>
  <text x="915" y="368" class="body">Impossible à situer sur les faits présents.</text>
  <text x="915" y="395" class="small">Aucun espace d’attente n’est établi.</text>
  <line x1="915" y1="420" x2="1325" y2="420" class="rule"/>
  <text x="915" y="456" class="tag warn">3 · ATTEINDRE UNE PRÉSENTATION</text>
  <text x="915" y="486" class="body">Sans traverser le travail : impossible.</text>
  <text x="915" y="513" class="small">Par Salon : entretien. Par Conseil : travail.</text>
  <rect x="915" y="535" width="410" height="38" rx="8" class="blank"/>
  <text x="1120" y="560" text-anchor="middle" class="tag warn">voie hall–galerie : besoin non dessiné</text>

  <rect x="45" y="620" width="1310" height="225" rx="16" class="panel"/>
  <text x="75" y="662" class="label">Lecture municipale — couches séparées</text>
  <text x="75" y="703" class="tag ok">GÉOMÉTRIE DEV</text><text x="245" y="703" class="body">livrée · 30307</text>
  <text x="75" y="740" class="tag unknown">TÂCHES PITCH</text><text x="245" y="740" class="body">60308 non remise · base 60301</text>
  <text x="75" y="777" class="tag unknown">CONSTAT GAIA</text><text x="245" y="777" class="body">50303 remise hors tranche · praticabilité ici inconnue</text>
  <text x="715" y="703" class="tag ok">ACCÈS JURIS</text><text x="880" y="703" class="body">livré · permission inconnue · Nova/10010 · recours 70303</text>
  <text x="715" y="740" class="tag unknown">TECHNIQUE</text><text x="880" y="740" class="body">40302 non remise · mesures inconnues</text>
  <text x="715" y="777" class="tag warn">RÉCEPTION ARIA</text><text x="880" y="777" class="body">fiche ouverte · lecture extérieure non consignée</text>
  <text x="75" y="817" class="small">Révision : même lot de tâches, lecteur sans explication de DEV. La 3D attend une question corporelle précise après constat et 2D.</text>
  <text x="1345" y="878" text-anchor="end" class="small">Aucune affectation · aucun droit · aucun moyen · aucun chantier décidé</text>
</svg>
