<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" role="img" aria-labelledby="title desc">
  <title id="title">Feuille 2 fictive autonome du gabarit 2.1</title>
  <desc id="desc">SVG A3 autonome contenant le fond complet de la fiche 2.1 et les valeurs fictives de la feuille 2 sur 2 : origine S0, raccord au point 4 à 11 pas au repère V1, puis point 5 à 14 pas, non observé.</desc>
  <defs>
    <style>.h{font-family:Arial,sans-serif;font-weight:700;font-size:7px;fill:#111}.m{font-family:Arial,sans-serif;font-size:4.1px;fill:#111}.s{font-family:Arial,sans-serif;font-size:3.2px;fill:#111}.fill{font-family:Arial,sans-serif;font-size:2.6px;fill:#111}.line{stroke:#111;stroke-width:.4}.box{fill:#fff;stroke:#111;stroke-width:.7}.shade{fill:#eee;stroke:#111;stroke-width:.4}</style>
    <g id="direction-block">
      <rect class="box" width="390" height="57"/>
      <text x="5" y="7" class="m">DIRECTION / CHEMIN :</text><line x1="44" y1="7" x2="210" y2="7" class="line"/>
      <text x="218" y="7" class="s">Feuille n°</text><line x1="236" y1="7" x2="250" y2="7" class="line"/><text x="253" y="7" class="s">sur</text><line x1="261" y1="7" x2="275" y2="7" class="line"/>
      <text x="5" y="15" class="s">Origine du comptage — repère exact :</text><line x1="63" y1="15" x2="382" y2="15" class="line"/>
      <text x="5" y="23" class="s">Raccord : point précédent n°</text><line x1="50" y1="23" x2="66" y2="23" class="line"/><text x="70" y="23" class="s">total cumulé</text><line x1="94" y1="23" x2="113" y2="23" class="line"/><text x="116" y="23" class="s">pas ; repère</text><line x1="139" y1="23" x2="382" y2="23" class="line"/>
      <rect x="4" y="27" width="382" height="7" class="shade"/>
      <text x="7" y="32" class="s">Point n°</text><text x="27" y="30.5" class="s">Total cumulé depuis</text><text x="27" y="33.2" class="s">l'origine (pas)</text><text x="76" y="32" class="s">État constaté*</text><text x="130" y="32" class="s">Repère ou chemin</text><text x="222" y="32" class="s">Observateur</text><text x="280" y="32" class="s">Observation</text>
      <path d="M4 34H386 M4 39.5H386 M4 45H386 M4 50.5H386 M4 56H386 M23 27V56 M72 27V56 M126 27V56 M218 27V56 M276 27V56" class="line" fill="none"/>
    </g>
  </defs>

  <!-- Fond complet du gabarit 2.1, contenu dans ce fichier. -->
  <text x="210" y="9" class="h" text-anchor="middle">FICHE LIBRE DE POINTS D'ÉCOUTE — V2.1</text>
  <text x="15" y="16" class="s">Chaque nombre est un TOTAL CUMULÉ depuis l'origine écrite pour son chemin, jamais un compte depuis le point précédent.</text>
  <g transform="translate(15 20)">
    <rect class="box" width="390" height="36"/><text x="5" y="8" class="m">POINT-SOURCE EXACT</text>
    <text x="5" y="16" class="s">Lieu / alcôve :</text><line x1="30" y1="16" x2="150" y2="16" class="line"/><text x="158" y="16" class="s">Repère spatial précis :</text><line x1="194" y1="16" x2="382" y2="16" class="line"/>
    <text x="5" y="25" class="s">Position et orientation :</text><line x1="43" y1="25" x2="230" y2="25" class="line"/><text x="238" y="25" class="s">Constaté par :</text><line x1="262" y1="25" x2="382" y2="25" class="line"/>
    <text x="5" y="33" class="s">Date / heure :</text><line x1="27" y1="33" x2="382" y2="33" class="line"/>
  </g>
  <g transform="translate(15 60)">
    <rect class="box" width="390" height="35"/><text x="5" y="8" class="m">CONDITIONS DU SON</text>
    <text x="5" y="16" class="s">Contenu / variation :</text><line x1="38" y1="16" x2="190" y2="16" class="line"/><text x="198" y="16" class="s">Niveau ou réglage constaté :</text><line x1="246" y1="16" x2="382" y2="16" class="line"/>
    <text x="5" y="25" class="s">Diffusion / orientation :</text><line x1="43" y1="25" x2="190" y2="25" class="line"/><text x="198" y="25" class="s">Début / fin :</text><line x1="220" y1="25" x2="382" y2="25" class="line"/>
    <text x="5" y="32" class="s">Autres conditions / événements :</text><line x1="56" y1="32" x2="382" y2="32" class="line"/>
  </g>
  <use href="#direction-block" transform="translate(15 100)"/>
  <use href="#direction-block" transform="translate(15 161)"/>
  <use href="#direction-block" transform="translate(15 222)"/>
  <text x="15" y="287" class="s">* ENTENDU, SEUIL INCERTAIN, NON ENTENDU ou NON OBSERVÉ. Un état peut revenir. Sur la première feuille, écrire « aucun » au raccord.</text>
  <text x="15" y="293" class="s">Maquette numérique : aucun relevé réel, impression, fabrication, pose ou essai au Quai n'est attesté.</text>

  <!-- Valeurs fictives, inscrites seulement dans les champs existants. -->
  <g class="fill">
    <text x="46" y="35.5">alcôve fictive</text><text x="211" y="35.5">S0 — centre fictif</text>
    <text x="60" y="44.5">source fixe, orientée chemin A</text><text x="279" y="44.5">A (fictif)</text><text x="44" y="52.5">temps fictif 00:00–00:01</text>
    <text x="55" y="75.5">son fictif constant</text><text x="263" y="75.5">réglage fictif inchangé</text>
    <text x="60" y="84.5">vers chemin A</text><text x="238" y="84.5">00:00 / 00:01</text><text x="75" y="91.5">aucun événement fictif</text>
    <text x="61" y="106.5">A — suite après V1</text><text x="252" y="106.5">2</text><text x="277" y="106.5">2</text>
    <text x="80" y="114.5">S0 — centre de la source fictive</text>
    <text x="67" y="122.5">4</text><text x="111" y="122.5">11</text><text x="155" y="122.5">V1</text>
    <text x="28" y="138.2">5</text><text x="44" y="138.2">14</text><text x="92" y="138.2">NON OBSERVÉ</text><text x="145" y="138.2">après V1, fictif</text><text x="238" y="138.2">A (fictif)</text><text x="293" y="138.2">écoute interrompue</text>
  </g>
</svg>
