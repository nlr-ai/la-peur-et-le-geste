    <path d="M123 314 C170 322 207 300 232 268" stroke="#c8f1ba" stroke-width="4" opacity=".66"/>
    <path d="M665 190 C734 235 778 288 810 370" stroke="#78c7b0" stroke-width="7" opacity=".68"/>
    <path d="M705 251 C749 241 790 253 831 287" stroke="#d4e9ae" stroke-width="4" opacity=".6"/>
