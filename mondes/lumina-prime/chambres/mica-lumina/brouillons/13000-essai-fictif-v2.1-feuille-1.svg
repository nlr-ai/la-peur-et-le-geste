<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210" role="img" aria-labelledby="title desc">
  <title id="title">Essai fictif de raccord, feuille 1 sur 2</title><desc id="desc">Quatre points fictifs à 2, 5, 8 et 11 pas cumulés depuis une source fictive S0.</desc>
  <style>.h{font:700 7px Arial;fill:#111}.m{font:4.5px Arial;fill:#111}.s{font:3.5px Arial;fill:#111}.box{fill:#fff;stroke:#111;stroke-width:.7}.shade{fill:#eee;stroke:#111;stroke-width:.4}.line{stroke:#111;stroke-width:.4}</style>
  <text x="148.5" y="10" class="h" text-anchor="middle">ESSAI FICTIF V2.1 — FEUILLE 1 SUR 2</text>
  <text x="12" y="18" class="m">Ceci n'est ni un relevé sonore, ni une impression, ni une fabrication, ni une pose.</text>
  <g transform="translate(12 25)"><rect class="box" width="273" height="38"/><text x="5" y="8" class="m">POINT-SOURCE EXACT : S0 — centre d'une alcôve fictive</text><text x="5" y="17" class="s">Position / orientation fictive : source fixe, orientée vers le chemin A</text><text x="5" y="26" class="s">Conditions fictives : son constant ; réglage fictif inchangé ; début 00:00, fin 00:01</text><text x="5" y="34" class="s">Observateur : A (fictif)</text></g>
  <g transform="translate(12 70)"><rect class="box" width="273" height="118"/><text x="5" y="9" class="m">DIRECTION / CHEMIN : A — depuis S0 vers un virage fictif</text><text x="205" y="9" class="m">Feuille 1 sur 2</text><text x="5" y="19" class="m">Origine du comptage : S0, centre de la source fictive</text><text x="5" y="29" class="m">Raccord : aucun — départ à 0 pas cumulés depuis S0</text>
    <rect x="4" y="36" width="265" height="13" class="shade"/><text x="7" y="44" class="s">Point</text><text x="27" y="41.5" class="s">Total cumulé</text><text x="27" y="46" class="s">depuis S0 (pas)</text><text x="67" y="44" class="s">État</text><text x="111" y="44" class="s">Repère / chemin fictif</text><text x="175" y="44" class="s">Observateur</text><text x="213" y="44" class="s">Observation fictive</text>
    <path d="M4 49H269 M4 65H269 M4 81H269 M4 97H269 M4 113H269 M23 36V113 M63 36V113 M107 36V113 M171 36V113 M209 36V113" class="line" fill="none"/>
    <g class="s"><text x="10" y="59">1</text><text x="39" y="59">2</text><text x="68" y="59">ENTENDU</text><text x="112" y="59">devant S0</text><text x="176" y="59">A (fictif)</text><text x="212" y="59">son perçu</text>
    <text x="10" y="75">2</text><text x="39" y="75">5</text><text x="68" y="75">NON ENTENDU</text><text x="112" y="75">derrière écran fictif</text><text x="176" y="75">A (fictif)</text><text x="212" y="75">son absent</text>
    <text x="10" y="91">3</text><text x="39" y="91">8</text><text x="68" y="91">ENTENDU</text><text x="112" y="91">ouverture fictive</text><text x="176" y="91">A (fictif)</text><text x="212" y="91">son revenu</text>
    <text x="10" y="107">4</text><text x="39" y="107">11</text><text x="68" y="107">SEUIL INCERTAIN</text><text x="112" y="107">virage fictif V1</text><text x="176" y="107">A (fictif)</text><text x="212" y="107">perception hésitante</text></g>
  </g>
  <text x="12" y="200" class="m">Raccord à reporter : point précédent n° 4 · total cumulé 11 pas · repère V1 · origine S0.</text>
</svg>
