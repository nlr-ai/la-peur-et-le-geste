<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="420mm" height="297mm" viewBox="0 0 420 297" role="img" aria-labelledby="title desc">
  <title id="title">Copie fictivement remplie du gabarit exact 2.1, feuille 1 sur 2</title>
  <desc id="desc">Le gabarit A3 exact de la fiche 2.1 est repris en fond. Seuls ses champs prévus sont remplis. Les points fictifs 1 à 4 portent 2, 5, 8 et 11 pas cumulés depuis S0.</desc>
  <image href="13000-fiche-points-ecoute-v2.1.svg" xlink:href="13000-fiche-points-ecoute-v2.1.svg" x="0" y="0" width="420" height="297"/>
  <g font-family="Arial, sans-serif" font-size="2.6" fill="#111">
    <!-- Champs point-source exact -->
    <text x="46" y="35.5">alcôve fictive</text><text x="211" y="35.5">S0 — centre fictif</text>
    <text x="60" y="44.5">source fixe, orientée chemin A</text><text x="279" y="44.5">A (fictif)</text><text x="44" y="52.5">temps fictif 00:00–00:01</text>
    <!-- Champs conditions du son -->
    <text x="55" y="75.5">son fictif constant</text><text x="263" y="75.5">réglage fictif inchangé</text>
    <text x="60" y="84.5">vers chemin A</text><text x="238" y="84.5">00:00 / 00:01</text><text x="75" y="91.5">aucun événement fictif</text>
    <!-- Champs du premier bloc, feuille et raccord -->
    <text x="61" y="106.5">A — depuis S0 vers V1</text><text x="252" y="106.5">1</text><text x="277" y="106.5">2</text>
    <text x="80" y="114.5">S0 — centre de la source fictive</text>
    <text x="67" y="122.5">aucun</text><text x="111" y="122.5">0</text><text x="155" y="122.5">S0</text>
    <!-- Quatre lignes existantes du premier bloc -->
    <text x="28" y="138.2">1</text><text x="44" y="138.2">2</text><text x="92" y="138.2">ENTENDU</text><text x="145" y="138.2">devant S0</text><text x="238" y="138.2">A (fictif)</text><text x="293" y="138.2">son perçu</text>
    <text x="28" y="143.7">2</text><text x="44" y="143.7">5</text><text x="92" y="143.7">NON ENTENDU</text><text x="145" y="143.7">derrière écran fictif</text><text x="238" y="143.7">A (fictif)</text><text x="293" y="143.7">son absent</text>
    <text x="28" y="149.2">3</text><text x="44" y="149.2">8</text><text x="92" y="149.2">ENTENDU</text><text x="145" y="149.2">ouverture fictive</text><text x="238" y="149.2">A (fictif)</text><text x="293" y="149.2">son revenu</text>
    <text x="28" y="154.7">4</text><text x="44" y="154.7">11</text><text x="92" y="154.7">SEUIL INCERTAIN</text><text x="145" y="154.7">virage fictif V1</text><text x="238" y="154.7">A (fictif)</text><text x="293" y="154.7">perception hésitante</text>
  </g>
</svg>
