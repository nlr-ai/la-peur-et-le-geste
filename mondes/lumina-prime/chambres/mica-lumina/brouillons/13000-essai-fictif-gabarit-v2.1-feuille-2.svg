<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="420mm" height="297mm" viewBox="0 0 420 297" role="img" aria-labelledby="title desc">
  <title id="title">Copie fictivement remplie du gabarit exact 2.1, feuille 2 sur 2</title>
  <desc id="desc">Le gabarit A3 exact de la fiche 2.1 est repris en fond. Seuls ses champs prévus sont remplis. Le raccord nomme le point 4 à 11 pas au repère V1, puis le point fictif 5 porte 14 pas cumulés et NON OBSERVÉ.</desc>
  <image href="13000-fiche-points-ecoute-v2.1.svg" xlink:href="13000-fiche-points-ecoute-v2.1.svg" x="0" y="0" width="420" height="297"/>
  <g font-family="Arial, sans-serif" font-size="2.6" fill="#111">
    <!-- Champs point-source exact répétés -->
    <text x="46" y="35.5">alcôve fictive</text><text x="211" y="35.5">S0 — centre fictif</text>
    <text x="60" y="44.5">source fixe, orientée chemin A</text><text x="279" y="44.5">A (fictif)</text><text x="44" y="52.5">temps fictif 00:00–00:01</text>
    <!-- Champs conditions du son répétés -->
    <text x="55" y="75.5">son fictif constant</text><text x="263" y="75.5">réglage fictif inchangé</text>
    <text x="60" y="84.5">vers chemin A</text><text x="238" y="84.5">00:00 / 00:01</text><text x="75" y="91.5">aucun événement fictif</text>
    <!-- Champs du même premier bloc, feuille et raccord -->
    <text x="61" y="106.5">A — suite après V1</text><text x="252" y="106.5">2</text><text x="277" y="106.5">2</text>
    <text x="80" y="114.5">S0 — centre de la source fictive</text>
    <text x="67" y="122.5">4</text><text x="111" y="122.5">11</text><text x="155" y="122.5">V1</text>
    <!-- Première ligne existante du premier bloc ; les trois autres restent vides -->
    <text x="28" y="138.2">5</text><text x="44" y="138.2">14</text><text x="92" y="138.2">NON OBSERVÉ</text><text x="145" y="138.2">après V1, fictif</text><text x="238" y="138.2">A (fictif)</text><text x="293" y="138.2">écoute interrompue</text>
  </g>
</svg>
