<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" width="420" height="96">
  <!-- Un écu parti : à dextre les chaînes d'or de Navarre sur gueules, à
       senestre le lys d'or sur azur ; et le nom gravé dans l'or. Dessin
       original, à grands traits : ce n'est pas un blason exact, c'est une
       enseigne. -->
  <defs>
    <linearGradient id="or" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1dc9a"/>
      <stop offset=".45" stop-color="#c9a24c"/>
      <stop offset=".6" stop-color="#9c7a2c"/>
      <stop offset="1" stop-color="#d8bb6a"/>
    </linearGradient>
    <filter id="grave" x="-5%" y="-20%" width="110%" height="140%">
      <feOffset dx="0" dy="1.2" in="SourceAlpha" result="bas"/>
      <feFlood flood-color="#000" flood-opacity=".7"/>
      <feComposite in2="bas" operator="in" result="ombre"/>
      <feMerge><feMergeNode in="ombre"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="ecu"><path d="M10 8 H86 V46 C86 70 66 82 48 90 C30 82 10 70 10 46 Z"/></clipPath>
  </defs>

  <g filter="url(#grave)">
    <g clip-path="url(#ecu)">
      <rect x="10" y="8" width="38" height="84" fill="#8c1c1c"/>
      <rect x="48" y="8" width="38" height="84" fill="#1f3170"/>
      <!-- les chaînes de Navarre, réduites à une croix et un sautoir de maillons -->
      <g fill="none" stroke="url(#or)" stroke-width="2.2">
        <path d="M29 12 V84 M12 44 H46 M14 18 L44 72 M44 18 L14 72"/>
        <circle cx="29" cy="44" r="4.5"/>
      </g>
      <!-- le lys -->
      <g fill="url(#or)">
        <path d="M67 22 C61 30 61 38 67 46 C73 38 73 30 67 22 Z"/>
        <path d="M66 46 C60 40 54 40 53 46 C54 50 58 50 61 47 C62 50 64 51 66 50 Z"/>
        <path d="M68 46 C74 40 80 40 81 46 C80 50 76 50 73 47 C72 50 70 51 68 50 Z"/>
        <rect x="58" y="50" width="18" height="3.5" rx="1"/>
        <path d="M65 53.5 L69 53.5 L68 64 L66 64 Z"/>
      </g>
    </g>
    <path d="M10 8 H86 V46 C86 70 66 82 48 90 C30 82 10 70 10 46 Z" fill="none" stroke="url(#or)" stroke-width="2.4"/>
  </g>

  <g filter="url(#grave)" font-family="'Palatino Linotype','Book Antiqua',Palatino,'Times New Roman',serif" fill="url(#or)">
    <text x="112" y="50" font-size="33" letter-spacing="6">NAVARRE</text>
    <text x="114" y="82" font-size="21" letter-spacing="14">1572</text>
  </g>
  <path d="M112 60 H404" stroke="#c9a24c" stroke-width=".8" opacity=".7"/>
</svg>
